name: Generate Profile Cards

on:
  # Refresh the stat cards every day at 03:30 UTC (00:30 in São Paulo)
  schedule:
    - cron: "30 3 * * *"
  # Allow running it by hand from the Actions tab
  workflow_dispatch:
  # Regenerate on push, ignoring the commits this workflow makes itself
  push:
    branches:
      - main
    paths-ignore:
      - "assets/*.svg"

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the SVG cards from the GitHub API
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/generate_cards.py

      - name: Commit the cards if they changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/streak.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push
